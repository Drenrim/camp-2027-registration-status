name: Poll Camp 2027 promotional openings

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camp-2027-registration-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test monotonic cutoff logic
        run: node --test poll.test.js
      - name: Read current Jackrabbit openings
        run: node poll.js
      - name: Publish changed status
        run: |
          if git diff --quiet -- registration-status.json; then
            echo "No registration-status change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registration-status.json
          git commit -m "Update Camp 2027 registration status"
          git push
